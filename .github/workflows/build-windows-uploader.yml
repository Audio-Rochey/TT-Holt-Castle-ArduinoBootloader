name: Build Windows UART uploader

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        working-directory: SerialUploader
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install build dependencies
        run: python -m pip install pyinstaller==6.22.3 pyserial==3.5

      - name: Build standalone executable
        run: python -m PyInstaller --clean --noconfirm --onefile --console --name tt-upload upload.py

      - name: Check executable starts
        run: |
          .\dist\tt-upload.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Uploader help check failed" }

      - name: Record executable checksum
        run: |
          $hash = (Get-FileHash .\dist\tt-upload.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  tt-upload.exe" | Set-Content -Encoding ascii .\dist\SHA256SUMS.txt

      - name: Save downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: tt-upload-windows-x86_64
          path: |
            SerialUploader/dist/tt-upload.exe
            SerialUploader/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
