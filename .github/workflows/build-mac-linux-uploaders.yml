name: Build Mac and Linux UART uploaders

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which uploader to build
        type: choice
        required: true
        default: macos-arm64
        options:
          - macos-arm64
          - linux-x86_64
          - both

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        env:
          TARGET: ${{ inputs.target }}
        run: |
          python3 - <<'PY'
          import json, os
          targets = [
              {"name": "macos-arm64", "runner": "macos-15", "machine": "arm64"},
              {"name": "linux-x86_64", "runner": "ubuntu-22.04", "machine": "x86_64"},
          ]
          chosen = [t for t in targets if os.environ["TARGET"] in ("both", t["name"])]
          if not chosen:
              raise SystemExit("Unknown build target")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": chosen}) + "\n")
          PY

  build:
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: SerialUploader
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          python - <<'PY'
          import os, platform
          assert platform.machine() == os.environ["EXPECTED_MACHINE"], platform.machine()
          print(platform.platform())
          PY

      - name: Install build dependencies
        run: python -m pip install pyinstaller==6.22.3 pyserial==3.5

      - name: Build standalone executable
        run: python -m PyInstaller --clean --noconfirm --onefile --console --name tt-upload upload.py

      - name: Check executable starts
        run: ./dist/tt-upload --help

      - name: Package executable and checksum
        env:
          TARGET: ${{ matrix.name }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, tarfile
          exe = pathlib.Path("dist/tt-upload")
          exe.chmod(0o755)
          checksum = pathlib.Path("dist/SHA256SUMS.txt")
          checksum.write_text(hashlib.sha256(exe.read_bytes()).hexdigest() + "  tt-upload\n")
          archive = pathlib.Path("dist") / ("tt-upload-" + os.environ["TARGET"] + ".tar.gz")
          with tarfile.open(archive, "w:gz") as output:
              output.add(exe, arcname="tt-upload/tt-upload")
              output.add(checksum, arcname="tt-upload/SHA256SUMS.txt")
          PY

      - name: Save downloadable build
        uses: actions/upload-artifact@v6
        with:
          name: tt-upload-${{ matrix.name }}
          path: SerialUploader/dist/tt-upload-${{ matrix.name }}.tar.gz
          if-no-files-found: error
          retention-days: 30
